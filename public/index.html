<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>idea-flow</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#d5dbe0,#16191c);--panel:light-dark(#fff,#1f2327);--ink:light-dark(#0d0f11,#eef1f3);--mute:light-dark(#5b646c,#97a1aa);--line:light-dark(#b7c0c7,#353b41);--red:#e8251a;--soft:light-dark(#eef1f3,#262b30)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,12px)}
h1{font-size:clamp(24px,4vw,34px);line-height:1.1;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.btn,.tab{font:inherit;font-size:14px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.tab{border-radius:999px;border-color:var(--line);background:var(--panel)}.tab[aria-selected=true],.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5}
input{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.fig{position:relative}.fig svg{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute);padding:6px 4px 0}
.pop{position:absolute;z-index:5;width:min(360px,calc(100% - 16px));background:var(--panel);border:1px solid var(--ink);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px}
.pop ul,.items{list-style:none;margin:0;padding:0}.pop ul{max-height:300px;overflow:auto}
.pop li,.items li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
small{display:block;color:var(--mute);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
h2{font-size:20px;line-height:1.25;margin:0}h3{font-size:14px;color:var(--mute);font-weight:500;margin:14px 0 4px}
.badge{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}.badge.r{background:var(--red);color:#fff}
table{border-collapse:collapse;font-size:13px;width:100%}td,th{padding:4px 6px;border-top:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}a{color:inherit}
#msg{font-size:14px;min-height:20px;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}.seg button{font:inherit;font-size:13px;min-height:40px;padding:0 12px;border:0;background:transparent;color:var(--ink);cursor:pointer}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.q{font-size:18px;line-height:1.45;margin:6px 0 2px}.to{font-size:16px;margin:12px 0 4px}.prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin:6px 0 10px}.prog i{display:block;height:100%;background:var(--ink)}
.big{flex:1;min-height:52px;font-size:16px}select{font:inherit;font-size:15px;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:100%}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:6px}.alts .btn{text-align:left;min-height:44px;padding:6px 12px;line-height:1.35}
</style></head><body><div class="wrap"><body><div class="wrap">
<h1>idea-flow</h1>
<p class="sub">開発の地図：機能ごとの作業・Issue の経過・決まりの文書を、GitHub から読んで見えるようにする道具。Claude も同じ地図を読んでから作業する。</p>
<div class="card" id="gate" hidden><label for="tok" class="sub">合言葉（ADMIN_TOKEN）</label><div class="row"><input id="tok" type="password" autocomplete="current-password" style="flex:1"><button class="btn p" id="saveTok">使う</button></div></div>
<div id="msg" aria-live="polite"></div>
<section id="v-rules"><div class="card" id="rules"></div></section>
</div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK='';try{TOK=localStorage.getItem('idea-flow-token')||''}catch(e){}
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json',authorization:'Bearer '+TOK,...(opt.headers||{})}});
 if(r.status===401){$('#gate').hidden=false;throw new Error('合言葉を入れてください')}const b=await r.json();if(!r.ok)throw new Error(b.error||r.status);return b}
const say=t=>{$('#msg').textContent=t};
// ── 決まりの診断（#7・#8） ──
let RV=null,RDOC=null,ROPEN=new Set(),RREPO='',RSUB='map';
const APPLIES={always:'自動で届く',role:'役割として届く',skill:'場面に合えば届く（スキル）',referenced:'渡さないと届かない'};
const FK={no_entry:'入口が無い',unreferenced:'入口からたどれない',duplicate:'同じことが2か所',definition:'同じ言葉を2か所で説明',conflict:'食い違いかもしれない',temporary:'終わったかもしれない',skill_overlap:'似た場面で呼ばれるスキル',dead_ref:'もう無いファイルを指している',skill_unused:'使っていない技術向けのスキル',orphan:'どこからも案内されていない'};
async function loadRules(){RV=await api('/api/rules');rulesView()}
const ritem=id=>RV.items.find(i=>i.id===id),rdoc=id=>RV.docs.find(d=>d.id===id);
const ghLink=(d,line)=>{const s=RV.sources.find(x=>x.repo===d.repo);return`https://github.com/${d.repo}/blob/${s?s.branch:'main'}/${d.path}${line?'#L'+line:''}`};
const fRepo=f=>{const d=rdoc(f.a)||rdoc((ritem(f.a)||{}).doc);return d?d.repo:(f.a.includes('|')?f.a.split('|')[0]:null)};
function ruleCard(it){const d=rdoc(it.doc);return`<div style="padding:6px 0"><p style="margin:0">${esc(it.text)}</p><small>${esc(d.path)}${it.heading?' › '+esc(it.heading):''} ・ <a href="${esc(ghLink(d,it.line))}" target="_blank" rel="noopener">${it.line}行目</a></small></div>`}
const ghFile=(repo,path,line)=>{const s=(RV.sources||[]).find(x=>x.repo===repo);return`https://github.com/${repo}/blob/${encodeURIComponent((s&&s.branch)||'main')}/${path.split('/').map(encodeURIComponent).join('/')}${line?'#L'+line:''}`};
// 見つかった問題から、そのリポジトリの Issue の下書きを GitHub で開く（#9）。立てるかどうかは人が GitHub で決める（この道具は書かない）
function issueDraft(f){const repo=fRepo(f);if(!repo)return'';
 const where=it=>{if(!it)return'';const d=rdoc(it.doc);return d?`- ${d.path} ${it.line}行目：${it.text}\n  ${ghLink(d,it.line)}`:''};
 const A=ritem(f.a),B=f.b?ritem(f.b):null,dA=rdoc(f.a),dB=f.b?rdoc(f.b):null;
 const lines=[A?where(A):'',B?where(B):'',!A&&dA?`- ${dA.path}`:'',!B&&dB?`- ${dB.path}`:'',f.detail&&f.detail.path?`- ${f.detail.path}`:'',...(f.detail&&f.detail.refs||[]).map(r=>`- ${r.line}行目 → ${r.ref} は無い`),...(f.detail&&f.detail.docs||[]).map(x=>`- ${x}`)].filter(Boolean);
 const head=(A&&rdoc(A.doc)||dA||{}).path||(f.detail&&f.detail.path)||'';
 const title=`決まりと文書：「${FK[f.kind]||f.kind}」を確かめて直す${head?`（${head}）`:''}`;
 const body=`機能：決まりと文書\n閉じる条件：この問題が idea-flow の文書の画面に出なくなる（直すか、「問題ではない」にする）\n\nidea-flow の文書の画面で見つかった問題：${FK[f.kind]||f.kind}${f.score?`（近さ ${(+f.score).toFixed(2)}）`:''}\n${lines.join('\n')}`.slice(0,3000);
 return`https://github.com/${repo}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`}
function findingHtml(f){let body='';
 if(f.kind==='no_entry'){body=`<p style="margin:4px 0">渡さないと届かない文書：${f.detail.docs.map(esc).join('、')}</p>${(f.detail.candidates||[]).map(c=>`<p style="margin:4px 0"><b>入口の候補：${esc(c.path)}</b><small>ここを入口から読ませると、参照をたどって ${c.reaches.map(esc).join('、')} にも届く</small></p>`).join('')}<p class="sub" style="margin:4px 0">候補は「ほかから参照されている数（まとめ役かどうか）」と「届く数」で選んでいます。入口にした文書の決まりはリポジトリ全体に効くので、全体に効いてよい中身かを確かめてください。</p>`}
 else if(f.kind==='unreferenced'){const d=rdoc(f.a);body=`<b>${esc(d.path)}</b><small>${f.detail.from&&f.detail.from.length?'参照しているのは '+f.detail.from.map(esc).join('、')+'（どれも入口から届かない）':'どの文書からも参照されていない'}</small>`}
 else if(f.kind==='dead_ref'){body=`<b>${esc(f.detail.path)}</b>${f.detail.refs.map(r=>`<p style="margin:6px 0 0"><a href="${esc(ghFile(f.a.split('|')[0],f.detail.path,r.line))}" target="_blank" rel="noopener">${r.line}行目</a>${r.heading?`「${esc(r.heading)}」`:''} → <code>${esc(r.ref)}</code> は無い<small>${r.gone?`${esc(r.gone.date)} のコミット ${esc(r.gone.sha)}「${esc(r.gone.message)}」で消えた`:'いつ消えたかは調べていません'}</small><small>${esc(r.text)}</small></p>`).join('')}`}
 else if(f.kind==='skill_unused'){body=`<b>${esc(f.detail.path)}</b><small>説明文の技術：${f.detail.techs.map(esc).join('・')}。どれも package.json に無い</small>`}
 else if(f.kind==='orphan'){body=`<a href="${esc(ghFile(f.a.split('|')[0],f.detail.path))}" target="_blank" rel="noopener"><b>${esc(f.detail.path)}</b></a><small>${f.detail.record?'記録・結果の文書。':''}${f.detail.lines}行。どの文書からも案内されていない</small>`}
 else if(f.kind==='skill_overlap'){const a=rdoc(f.a),b=rdoc(f.b);body=`<b>${esc(a.title||a.path)}</b> と <b>${esc(b.title||b.path)}</b><small>説明文の近さ ${(+f.score).toFixed(2)}</small>`}
 else{const A=ritem(f.a),B=f.b?ritem(f.b):null;body=`${A?ruleCard(A):''}${B?`<p class="sub" style="margin:2px 0">↕ ${f.kind==='duplicate'?'ほぼ同じ':'近い'}（近さ ${(+f.score).toFixed(2)}）</p>${ruleCard(B)}`:''}${f.kind==='temporary'?`<small>当たった言葉：「${esc(f.detail.word)}」</small>`:''}${f.kind==='definition'?`<small>同じ言葉：${f.detail.terms.map(esc).join('、')}</small>`:''}`}
 return`<li>${body}<div class="row"><input data-why="${esc(f.key)}" placeholder="理由（任意）" style="flex:1 1 160px"><button class="btn s" data-dismiss="${esc(f.key)}">問題ではない</button>${issueDraft(f)?`<a class="btn s" href="${esc(issueDraft(f))}" target="_blank" rel="noopener">Issue の下書きを開く</a>`:''}</div></li>`}
function rulesView(){const el=$('#rules');if(!RV){el.innerHTML='<p class="sub">読み込み中…</p>';return}
 if(RDOC){const d=rdoc(RDOC);if(!d){RDOC=null;return rulesView()}const its=RV.items.filter(i=>i.doc===d.id);
  const byH={};its.forEach(i=>(byH[i.heading||'（見出しなし）']=byH[i.heading||'（見出しなし）']||[]).push(i));
  el.innerHTML=`<div class="row" style="margin:0"><button class="btn" data-rback="1">← 文書に戻る</button></div><h2 style="margin-top:10px">${esc(d.title||d.path)}</h2><p class="sub"><a href="${esc(ghLink(d))}" target="_blank" rel="noopener">${esc(d.path)}</a>・${APPLIES[d.applies]}・決まり ${its.length}${d.external?'・外から入れたもの':''}</p>
  ${d.description?`<p class="sub" style="margin-top:6px">呼ばれる場面（説明文）：${esc(d.description)}</p>`:''}
  ${Object.entries(byH).map(([h,xs])=>`<h3>${esc(h)}</h3>${xs.map(i=>{const f=RV.findings.filter(x=>x.a===i.id||x.b===i.id);return`<div class="rule" style="padding:6px 0">${esc(i.text)}${f.map(x=>` <span class="badge r">${FK[x.kind]}</span>`).join('')}<small><a href="${esc(ghLink(d,i.line))}" target="_blank" rel="noopener">${i.line}行目</a></small></div>`}).join('')}`).join('')}`;return}
 const repos=[...new Set([...RV.sources.map(s=>s.repo),...RV.docs.map(d=>d.repo)])];
 if(!RREPO||!repos.includes(RREPO))RREPO=repos.find(x=>RV.docs.some(d=>d.repo===x))||repos[0]||'';
 const head=`<div class="row" style="margin:0">${repos.length>1?`<select id="rrepo" style="flex:1 1 200px" aria-label="リポジトリ">${repos.map(x=>`<option ${x===RREPO?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<b>${esc(RREPO||'リポジトリはまだありません')}</b>`}</div>
 <div class="tabs" role="tablist" style="margin-top:8px">${[['map','地図'],['docs','文書']].map(([k,l])=>`<button class="tab" role="tab" data-rsub="${k}" aria-selected="${RSUB===k}">${l}</button>`).join('')}</div>`;
 if(RSUB==='map'&&RREPO){el.innerHTML=head+'<div id="rmap" style="margin-top:10px"></div>';window.WorkMap.render($('#rmap'),RREPO);return}
 el.innerHTML=head+`<h2 style="margin-top:12px">文書</h2><p class="sub">リポジトリの決まりの文書（CLAUDE.md・スキル・docs など）の一覧と、Claude への届き方、気になる所（重複・食い違い・古い決まり・どこからも読まれない文書）。読むだけで、GitHub には書き込みません。</p>
 ${RV.stale?`<div style="border:1px solid var(--red);border-radius:10px;padding:10px 12px;margin-top:10px"><b>診断の仕方が新しくなりました</b><p class="sub" style="margin:4px 0">下の結果は古い仕方のままです。取り込み直すと新しい診断になります。</p><div class="row">${[...new Set(RV.docs.map(d=>d.repo))].map(r=>`<button class="btn s p" data-rsync="${esc(r)}">${esc(r.split('/')[1])} を取り込み直す</button>`).join('')}</div></div>`:''}
 ${repos.filter(x=>x===RREPO||!RREPO).map(r=>{const s=RV.sources.find(x=>x.repo===r),ds=RV.docs.filter(d=>d.repo===r),dg=RV.diagnosis[r]||{conclusions:[],external:[]};const key=r.replace(/[^\w]/g,'_');
  return`<div class="card" style="margin-top:14px;padding:12px"><div class="row" style="margin:0;justify-content:space-between"><b>${esc(r)}</b><span class="sub">${s&&s.synced_at?esc(s.synced_at.slice(0,10)):'未取り込み'}</span></div>
  <h3>文書（${ds.length}件）</h3><p class="sub" style="margin:0">押すと、見出しごとの決まりが読めます。</p>
  <ul class="items">${[...ds].sort((a,b)=>Object.keys(APPLIES).indexOf(a.applies)-Object.keys(APPLIES).indexOf(b.applies)||a.path.localeCompare(b.path)).map(d=>`<li><div data-rdoc="${esc(d.id)}" style="cursor:pointer">${esc(d.path)}${(n=>n?` <span class="badge r">気になる所 ${n}</span>`:'')(RV.findings.filter(f=>f.a===d.id||f.b===d.id||(ritem(f.a)||{}).doc===d.id||(ritem(f.b)||{}).doc===d.id).length)}<small>${APPLIES[d.applies]}・決まり ${RV.items.filter(i=>i.doc===d.id).length}${d.external?`・外から入れたもの${d.external_by==='auto'?'（ライセンスのファイルから判定）':''}`:''}</small></div><div class="row" style="margin-top:4px"><button class="btn s" data-rext="${esc(d.repo+'|'+d.path)}" data-v2="${d.external?0:1}">${d.external?'このリポジトリの決まりとして扱う':'外から入れたもの（診断しない）にする'}</button></div></li>`).join('')}</ul>
  <div style="margin-top:6px"><div class="row"><button class="btn s" data-rfiles="${esc(r)}">ファイルを選ぶ</button><button class="btn s p" data-rsync="${esc(r)}">取り込む</button></div><div id="rf-${key}"></div></div>
  <h3>気になる所</h3>
  ${!ds.length?`<p class="sub" style="margin-top:8px">まだ取り込んでいません。</p>`:dg.conclusions.length?dg.conclusions.map((c,k)=>{const fs=RV.findings.filter(f=>f.kind===c.kind&&fRepo(f)===r),op=ROPEN.has(r+'|'+c.kind);
   return`<div style="border-top:1px solid var(--line);padding:12px 0 8px;margin-top:8px"><p style="margin:0;font-weight:700;font-size:17px">${k+1}. ${esc(c.title)}</p><p style="margin:4px 0" class="sub">${esc(c.why)}</p>${c.list&&c.list.length?`<ul style="margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--mute)">${c.list.slice(0,3).map(l=>`<li>${esc(l)}</li>`).join('')}${c.list.length>3?`<li>ほか ${c.list.length-3}件</li>`:''}</ul>`:''}<p style="margin:6px 0"><span class="badge k">次の一手</span> ${esc(c.next)}</p>
   <button class="btn s" data-ropen="${esc(r+'|'+c.kind)}">${op?'閉じる':'詳しく見る'}</button>${op?`<ul class="items" style="margin-top:6px">${fs.slice(0,40).map(findingHtml).join('')}</ul>${fs.length>40?`<p class="sub">ほか ${fs.length-40}件</p>`:''}`:''}</div>`}).join(''):'<p style="margin-top:8px">問題は見つかっていません。</p>'}
  ${dg.external.length?`<p class="sub" style="margin-top:10px">外から入れた決まり ${dg.external.length}件（書き換えないもの）は診断から外しています。</p>`:''}
  </div>`}).join('')}
 <div class="row"><input id="newrepo" placeholder="owner/name を足す" style="flex:1 1 180px"><button class="btn s" id="addrepo">足す</button></div>
 ${RV.dismissed?`<p class="sub" style="margin-top:8px">「問題ではない」にしたもの ${RV.dismissed}件は出していません。</p>`:''}`}
async function pickFiles(repo){const box=$('#rf-'+repo.replace(/[^\w]/g,'_'));box.innerHTML='<p class="sub">一覧を読んでいます…</p>';const r=await api('/api/rules/files?repo='+encodeURIComponent(repo));
 box.innerHTML=`<p class="sub">決まりとして読むファイルを選ぶ（${r.files.length}件の .md）</p><div style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px">${r.files.map(f=>`<label style="display:flex;gap:8px;align-items:center;min-height:36px;font-size:14px"><input type="checkbox" data-rpick="${esc(f.path)}" ${f.picked?'checked':''} style="width:auto"> ${esc(f.path)} <span class="badge">${APPLIES[f.applies]}</span>${f.external?'<span class="badge">外から入れたもの</span>':''}</label>`).join('')}</div><div class="row"><button class="btn s p" data-rsave="${esc(repo)}">選んだものを保存</button></div>`}
document.addEventListener('click',e=>{const dd=e.target.closest('[data-rdoc]');if(dd&&!e.target.closest('a,button,input')){RDOC=dd.dataset.rdoc;rulesView();window.scrollTo(0,0)}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 try{
 if(b.id==='saveTok'){TOK=$('#tok').value.trim();try{localStorage.setItem('idea-flow-token',TOK)}catch(_){}await load();return}
 if(b.dataset.rback){RDOC=null;rulesView();return}
 if(b.dataset.rsub){RSUB=b.dataset.rsub;rulesView();return}
 if(b.dataset.ropen){const k=b.dataset.ropen;ROPEN.has(k)?ROPEN.delete(k):ROPEN.add(k);rulesView();return}
 if(b.dataset.rext){const [repo,...pp]=b.dataset.rext.split('|');b.disabled=true;await api('/api/rules/external',{method:'POST',body:JSON.stringify({repo,path:pp.join('|'),external:b.dataset.v2==='1'})});await loadRules();say('変えました（次の取り込みからも効きます）');return}
 if(b.dataset.rfiles){await pickFiles(b.dataset.rfiles);return}
 if(b.dataset.rsave){const files=[...document.querySelectorAll('[data-rpick]')].filter(x=>x.checked).map(x=>x.dataset.rpick);await api('/api/rules/source',{method:'POST',body:JSON.stringify({repo:b.dataset.rsave,files})});say(`${files.length}件を選びました。「取り込む」を押してください`);await loadRules();return}
 if(b.dataset.rsync){b.disabled=true;b.textContent='取り込み中…（1〜2分）';say(b.dataset.rsync+' を読んでいます（1〜2分かかることがあります）…');const r=await api('/api/rules/sync',{method:'POST',body:JSON.stringify({repo:b.dataset.rsync})});say(`取り込み：文書 ${r.docs}・決まり ${r.items}（埋め込み ${r.embedded}件）・読んだファイル ${r.read??'—'}件（変わっていない ${r.reused??'—'}件は前回の写し）`);await loadRules();return}
